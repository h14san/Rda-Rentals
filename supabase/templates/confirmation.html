<!--
  Sign-up code for NEW users.

  Needed as well as magic_link.html: with email confirmations enabled,
  signInWithOtp sends this template to users who do not exist yet and the
  magic-link template to those who do. Fixing only one leaves first-time
  sign-up broken, which is the path every new user takes.
-->
<h2>Welcome to Rwanda Rentals</h2>
<p>Enter this code in the app to finish creating your account:</p>
<p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0">
  {{ .Token }}
</p>
<p style="color: #6b7280; font-size: 14px">
  The code expires in one hour. If you did not request it, you can ignore this email.
</p>
