name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # .expo/types and expo-env.d.ts are generated by the dev server and are
      # not committed, so typed routes are not enforced here. That only makes
      # CI more permissive than a local run, never stricter.
      - run: npm run typecheck

      - run: npx eslint .

      # Deliberately no database step: db:rls-check needs credentials for the
      # live project and stays a local, pre-merge check.
